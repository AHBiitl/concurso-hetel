<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#03060d;--panel:#0a1422;--line:#1a2c46;
  --txt:#e8eef8;--muted:#8ba0be;
  --green:#34d399;--red:#f87171;--cyan:#22d3ee;--violet:#a78bfa;--amber:#fbbf24;--pink:#f472b6;
}
html,body{overflow-x:hidden}
body{background:#03060d;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:40px;position:relative}
.cyber-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cyber-bg .base{position:absolute;inset:0;background:radial-gradient(1200px 700px at 15% -10%,#0a2540 0%,transparent 55%),radial-gradient(1000px 600px at 100% 5%,#1a0e3a 0%,transparent 55%),linear-gradient(180deg,#03060d 0%,#050b18 50%,#03060d 100%)}
.cyber-bg .grid{position:absolute;left:-10%;right:-10%;bottom:-5%;height:60%;background-image:linear-gradient(to right,rgba(34,211,238,.13) 1px,transparent 1px),linear-gradient(to bottom,rgba(34,211,238,.13) 1px,transparent 1px);background-size:60px 60px;transform:perspective(400px) rotateX(60deg);transform-origin:center bottom;mask-image:linear-gradient(to top,#000 0%,transparent 90%);-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 90%);animation:gridScroll 14s linear infinite}
@keyframes gridScroll{from{background-position:0 0}to{background-position:0 60px}}
.cyber-bg #matrix{position:absolute;inset:0;width:100%;height:100%;opacity:.22;mix-blend-mode:screen}
#stage{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:24px 18px;transition:max-width .25s ease}
#stage.stage-select{max-width:1280px;padding:clamp(24px,4vh,48px) clamp(18px,4vw,52px)}
#stage.stage-select>.panel{min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:center}
.hud{position:sticky;top:0;z-index:50;background:rgba(3,6,13,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 14px}
.hud-inner{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.language-control{display:flex;align-items:center;gap:8px;background:rgba(10,20,34,.85);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.language-control label{color:var(--muted);font-size:.65rem;font-weight:900;letter-spacing:1px}
.language-control select{font:inherit;font-size:.78rem;font-weight:800;color:var(--txt);background:#0a1422;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.language-control select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.chip{display:flex;align-items:center;gap:8px;background:rgba(10,20,34,.85);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.8rem}
.chip .lbl{color:var(--muted);font-weight:800;font-size:.6rem;letter-spacing:1.3px}
.chip .val{font-weight:900;font-variant-numeric:tabular-nums;font-size:.95rem}
.val.pos{color:var(--green)}.val.neg{color:var(--red)}
.dots{display:flex;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;background:#22314a;border:1px solid #2c3f5c;transition:.35s}
.dot.on{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px -2px var(--cyan)}
.dot.done{background:var(--green);border-color:var(--green)}
.panel{background:linear-gradient(165deg,rgba(16,26,44,.94),rgba(8,16,28,.94));border:1px solid var(--line);border-radius:22px;padding:26px 24px;box-shadow:0 24px 60px -30px #000;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.title{font-size:clamp(1.4rem,4vw,2rem);letter-spacing:-.5px;text-align:center;margin-bottom:12px;font-weight:900}
.title span{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:var(--muted);text-align:center;line-height:1.7;font-size:.92rem;max-width:640px;margin:0 auto 22px}
.rules{display:grid;gap:10px;margin:20px 0}
.rule{display:flex;gap:12px;align-items:flex-start;background:rgba(10,20,34,.75);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.85rem;line-height:1.55;color:#cdd9ea}
.rule .num{flex-shrink:0;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem;background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.3)}
.rule:nth-child(1) .num{background:rgba(52,211,153,.12);color:var(--green);border-color:rgba(52,211,153,.3)}
.rule:nth-child(3) .num{background:rgba(251,191,36,.12);color:var(--amber);border-color:rgba(251,191,36,.3)}
.rule:nth-child(4) .num{background:rgba(248,113,113,.12);color:var(--red);border-color:rgba(248,113,113,.3)}
.rule:nth-child(5) .num{background:rgba(34,211,238,.12);color:var(--cyan);border-color:rgba(34,211,238,.3)}
.maxscore{background:rgba(10,20,34,.75);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:22px 0}
.maxscore-title{font-size:.7rem;font-weight:900;letter-spacing:1.8px;color:var(--amber);text-align:center;margin-bottom:12px}
.maxscore-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:.85rem;border-bottom:1px dashed rgba(255,255,255,.07)}
.maxscore-row:last-of-type{border-bottom:none}
.maxscore-row .ms-left{display:flex;align-items:center;gap:8px;color:#cdd9ea}
.maxscore-row .ms-right{font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}
.maxscore-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:1rem;font-weight:900}
.maxscore-total .ms-left{color:var(--txt)}
.maxscore-total .ms-right{color:var(--amber);font-variant-numeric:tabular-nums}
.temas-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:30px 0}
.tema-card{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(20,34,56,.94),rgba(8,16,29,.94));border:1px solid var(--line);border-radius:20px;padding:24px 22px;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;text-align:left;font-family:inherit;color:var(--txt);display:flex;flex-direction:column;gap:14px;min-height:178px;animation:tema-reveal .5s both}
.tema-card::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--tc,var(--cyan));opacity:.75}
.tema-card:hover{transform:translateY(-5px);border-color:var(--tc,var(--cyan));box-shadow:0 18px 38px -25px var(--tc,var(--cyan))}
.tema-card:focus-visible{outline:3px solid var(--tc,var(--cyan));outline-offset:3px}
.tema-card.done{border-color:rgba(52,211,153,.5);background:linear-gradient(160deg,rgba(14,38,32,.85),rgba(10,26,24,.85))}
.tema-head{display:flex;align-items:center;gap:12px}
.tema-ico-wrap{position:relative;width:60px;height:60px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid var(--tc,rgba(34,211,238,.4));will-change:transform,box-shadow}
.tema-phishing .tema-ico-wrap,.game-emblem-phishing{animation:tema-cast 3.2s ease-in-out infinite}
.tema-encriptado .tema-ico-wrap,.game-emblem-encriptado{animation:tema-lock 2.8s ease-in-out infinite}
.tema-contrasenas .tema-ico-wrap,.game-emblem-contrasenas{animation:tema-key 3.2s ease-in-out infinite}
.tema-malware .tema-ico-wrap,.game-emblem-malware{animation:tema-infect 3.6s ease-in-out infinite}
.tema-redes .tema-ico-wrap,.game-emblem-redes{animation:tema-broadcast 2.6s ease-in-out infinite}
.tema-ingSocial .tema-ico-wrap,.game-emblem-ingSocial{animation:tema-think 3.4s ease-in-out infinite}
@keyframes tema-reveal{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:blur(0)}}
@keyframes tema-cast{0%,100%{transform:translateY(0) rotate(-3deg)}35%{transform:translateY(-5px) rotate(4deg)}68%{transform:translateY(1px) rotate(-5deg)}}
@keyframes tema-lock{0%,100%{transform:scale(1) rotate(0)}42%{transform:scale(1.06) rotate(-4deg)}55%{transform:scale(1.06) rotate(4deg)}68%{transform:scale(1) rotate(0)}}
@keyframes tema-key{0%,100%{transform:rotate(0)}28%{transform:rotate(-14deg)}48%{transform:rotate(5deg)}68%{transform:rotate(-10deg)}}
@keyframes tema-infect{0%,70%,100%{transform:scale(1) rotate(0);box-shadow:0 0 0 0 rgba(248,113,113,0)}76%{transform:scale(1.08) rotate(-5deg);box-shadow:0 0 20px -5px rgba(248,113,113,.65)}80%{transform:scale(.97) rotate(5deg)}84%{transform:scale(1.04) rotate(-2deg)}}
@keyframes tema-broadcast{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(96,165,250,0)}45%{transform:scale(1.04);box-shadow:0 0 0 7px rgba(96,165,250,.12)}70%{transform:scale(1);box-shadow:0 0 22px -5px rgba(96,165,250,.65)}}
@keyframes tema-think{0%,100%{transform:translateY(0) rotate(0)}32%{transform:translateY(-4px) rotate(3deg)}58%{transform:translateY(-2px) rotate(-3deg)}76%{transform:translateY(1px) rotate(1deg)}}
.tema-card .tema-name{font-size:1.12rem;font-weight:900;color:var(--tc,var(--cyan))}
.tema-card .tema-desc{font-size:.84rem;line-height:1.55;color:var(--muted)}
.tema-card .tema-max{font-size:.72rem;color:var(--amber);font-weight:800}
.tema-card .tag{font-size:.6rem;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid;align-self:flex-start}
.tag-done{color:var(--green);border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.14)}
.select-highlights{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 6px}
.select-highlight{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(10,20,34,.72);font-size:.76rem;font-weight:800;color:#cdd9ea}
@media(max-width:900px){.temas-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tema-card{min-height:160px;padding:20px}}
@media(max-width:560px){#stage.stage-select{padding:18px 14px}.temas-grid{grid-template-columns:1fr;gap:12px;margin:22px 0}.tema-card{min-height:0;padding:17px}.tema-ico-wrap{width:50px;height:50px;font-size:1.7rem}.select-highlights{gap:7px}.select-highlight{font-size:.68rem;padding:8px 10px}}
@media(prefers-reduced-motion:reduce){.tema-card{animation:none}.tema-ico-wrap{animation:none!important}}
.btn{display:block;width:100%;font-family:inherit;font-size:.95rem;font-weight:800;padding:15px 20px;border-radius:14px;cursor:pointer;border:1px solid;transition:.2s;letter-spacing:.3px}
.btn-primary{background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(167,139,250,.22));border-color:rgba(34,211,238,.55);color:#c8ecf7}
.btn-primary:hover{background:linear-gradient(135deg,rgba(34,211,238,.36),rgba(167,139,250,.36));transform:translateY(-2px)}
.btn-secondary{background:rgba(255,255,255,.03);border-color:var(--line);color:var(--muted);margin-top:10px;font-size:.85rem;padding:12px 18px}
.btn-secondary:hover{background:rgba(255,255,255,.07);color:var(--txt)}
.btn-finish{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.5);color:var(--amber);margin-top:14px}
.btn-finish:hover{background:rgba(251,191,36,.24);transform:translateY(-2px)}
.btn-final{background:linear-gradient(135deg,rgba(52,211,153,.25),rgba(34,211,238,.25));border-color:rgba(52,211,153,.6);color:#c8ecf7;margin-top:14px;box-shadow:0 0 30px -10px rgba(52,211,153,.6)}
.btn-final:hover{background:linear-gradient(135deg,rgba(52,211,153,.4),rgba(34,211,238,.4));transform:translateY(-2px)}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.game-title{font-size:1.05rem;font-weight:900;color:var(--tc,var(--cyan))}
.game-info{display:flex;gap:8px;flex-wrap:wrap}
.badge{background:rgba(10,20,34,.85);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.72rem;font-weight:800;color:var(--muted)}
.badge b{color:var(--txt)}
.task-banner{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.35);border-radius:13px;padding:12px 16px;font-size:.85rem;color:#c3d2e6;line-height:1.6;margin-bottom:18px;text-align:center}
.task-banner b{color:var(--cyan)}
.clicker-grid{display:grid;gap:12px;margin-bottom:6px}
.clicker-grid.cols-2{grid-template-columns:1fr 1fr}
.clicker-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.clicker-grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:680px){.clicker-grid.cols-2,.clicker-grid.cols-3,.clicker-grid.cols-4{grid-template-columns:1fr}}
.click-item{position:relative;background:rgba(10,20,34,.85);border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.2s;font-family:inherit;color:var(--txt);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:70px}
.click-item:hover{border-color:#3b4d6a;transform:translateY(-2px)}
.click-item.marked{border-color:var(--cyan);background:linear-gradient(160deg,rgba(34,211,238,.15),rgba(34,211,238,.05))}
.click-item.locked{cursor:default;pointer-events:none}

.email-inbox{background:linear-gradient(180deg,rgba(3,6,13,.6),rgba(3,6,13,.4));border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:6px;box-shadow:0 8px 30px -20px #000 inset}
.email-inbox-bar{background:linear-gradient(180deg,rgba(30,45,70,.7),rgba(15,25,42,.7));border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.email-inbox-title{font-size:.9rem;font-weight:900;color:var(--cyan);display:flex;align-items:center;gap:8px}
.email-inbox-count{font-size:.68rem;color:var(--muted);font-weight:800;padding:4px 11px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);border-radius:999px;font-variant-numeric:tabular-nums}
.email-list{display:flex;flex-direction:column}
.email-card{position:relative;padding:16px 20px;border-bottom:1px solid rgba(26,44,70,.6);cursor:pointer;transition:all .22s;background:transparent;font-family:inherit;color:var(--txt);text-align:left;width:100%;border-left:3px solid transparent;border-right:none;border-top:none}
.email-card:last-child{border-bottom:none}
.email-card:hover{background:rgba(34,211,238,.05);border-left-color:rgba(34,211,238,.6)}
.email-card.marked{background:rgba(248,113,113,.09);border-left-color:var(--red)}
.email-card.locked{cursor:default;pointer-events:none}
.email-card.marked::after{content:'🚨';position:absolute;top:14px;right:14px;font-size:1.5rem;animation:dangerPulse 1.1s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(248,113,113,.8))}
@keyframes dangerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.email-header{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.email-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05rem;flex-shrink:0;color:var(--cyan);border:1px solid rgba(34,211,238,.35);background:linear-gradient(135deg,#1a2d45,#0d1826);font-family:'Courier New',monospace;text-transform:uppercase}
.email-card.marked .email-avatar{background:linear-gradient(135deg,#3a1a20,#2a0e14);border-color:rgba(248,113,113,.55);color:var(--red)}
.email-info{flex:1;min-width:0}
.email-sender-name{font-weight:900;font-size:.88rem;color:var(--txt);margin-bottom:2px}
.email-card.marked .email-sender-name{color:#fca5a5}
.email-sender-addr{font-family:'Courier New',monospace;font-size:.72rem;color:var(--cyan);word-break:break-all;font-weight:700}
.email-card.marked .email-sender-addr{color:#fca5a5}
.email-meta{flex-shrink:0;text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.email-time{font-size:.68rem;color:var(--muted);font-weight:700}
.email-badge{font-size:.6rem;font-weight:900;padding:2px 8px;border-radius:4px;font-family:'Courier New',monospace}
.email-badge.priority{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.4)}
.email-badge.attach{background:rgba(251,191,36,.12);color:var(--amber);border:1px solid rgba(251,191,36,.35)}
.email-subject-line{display:flex;gap:8px;align-items:center;margin-bottom:6px;padding-left:54px}
.email-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);flex-shrink:0}
.email-card.marked .email-unread-dot{background:var(--red)}
.email-subject{font-weight:800;font-size:.93rem;color:var(--txt);flex:1}
.email-card.marked .email-subject{color:#fca5a5}
.email-body{font-size:.82rem;color:var(--muted);line-height:1.55;padding-left:54px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}

.file-explorer{background:linear-gradient(180deg,rgba(3,6,13,.6),rgba(3,6,13,.4));border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:6px;box-shadow:0 8px 30px -20px #000 inset}
.file-explorer-bar{background:linear-gradient(180deg,rgba(30,45,70,.7),rgba(15,25,42,.7));border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;font-size:.72rem}
.fe-dots{display:flex;gap:5px;flex-shrink:0}
.fe-dots span{width:10px;height:10px;border-radius:50%}
.fe-dots span:nth-child(1){background:#f87171}
.fe-dots span:nth-child(2){background:#fbbf24}
.fe-dots span:nth-child(3){background:#34d399}
.fe-path{flex:1;font-family:'Courier New',monospace;color:#8ba0be;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fe-count{color:var(--cyan);font-weight:900;font-family:'Courier New',monospace;font-size:.72rem}
.fe-legend{background:rgba(3,6,13,.6);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:12px;font-size:.62rem;color:var(--muted)}
.fe-legend-item{display:flex;align-items:center;gap:5px}
.fe-legend-badge{padding:1px 7px;border-radius:999px;background:rgba(139,160,190,.15);border:1px solid rgba(139,160,190,.3);color:#cdd9ea;font-family:'Courier New',monospace;font-weight:900;font-size:.55rem}
.file-explorer .clicker-grid{padding:16px}
.file-item{padding:16px 10px;min-height:160px;background:linear-gradient(160deg,#16233a,#0b1420);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;transition:.25s;position:relative;border:2px solid var(--line);border-radius:14px;cursor:pointer;font-family:inherit;color:var(--txt);text-align:center}
.file-item:hover{transform:translateY(-4px) scale(1.02);border-color:rgba(34,211,238,.6)}
.file-icon-wrap{width:60px;height:60px;border-radius:15px;background:linear-gradient(160deg,rgba(34,211,238,.08),rgba(167,139,250,.06));border:1px solid rgba(34,211,238,.2);display:flex;align-items:center;justify-content:center;transition:.25s;flex-shrink:0}
.file-item:hover .file-icon-wrap{background:linear-gradient(160deg,rgba(34,211,238,.18),rgba(167,139,250,.12));transform:scale(1.08)}
.file-icon{font-size:1.9rem;line-height:1}
.file-name{font-family:'Courier New',monospace;font-size:.68rem;font-weight:700;color:#cdd9ea;word-break:break-all;line-height:1.3;max-width:100%}
.file-ext-badge{font-size:.58rem;font-weight:900;padding:3px 10px;border-radius:999px;background:rgba(139,160,190,.15);color:#cdd9ea;border:1px solid rgba(139,160,190,.3);font-family:'Courier New',monospace}
.click-item.file-item.marked{border-color:var(--red);background:linear-gradient(160deg,rgba(248,113,113,.15),rgba(248,113,113,.03))}
.click-item.file-item.marked::after{content:'🦠';position:absolute;top:8px;right:10px;font-size:1.5rem;animation:dangerPulse 1s infinite;filter:drop-shadow(0 0 10px rgba(248,113,113,.9))}
.click-item.file-item.marked .file-name{color:#fca5a5}
.click-item.file-item.marked .file-ext-badge{background:rgba(248,113,113,.2);color:#fca5a5;border-color:rgba(248,113,113,.4)}

/* PASSWORD CREATOR */
.pwd-create-wrap{display:flex;flex-direction:column;gap:16px}
.pwd-input-wrap{position:relative}
.pwd-input{width:100%;font-family:'Courier New',monospace;font-size:1.1rem;font-weight:700;color:var(--cyan);background:rgba(3,6,13,.85);border:2px solid rgba(34,211,238,.45);border-radius:14px;padding:18px 60px 18px 20px;letter-spacing:1px;transition:.2s}
.pwd-input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.pwd-toggle-vis{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.35);color:var(--cyan);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:.2s;font-family:inherit}
.pwd-toggle-vis:hover{background:rgba(34,211,238,.25)}
.pwd-charcount{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-weight:800;margin-top:6px;padding:0 4px}
.pwd-charcount .cnt{color:var(--cyan);font-variant-numeric:tabular-nums}
.pwd-score-hero{text-align:center;padding:20px 0;margin-bottom:16px;border-bottom:1px solid var(--line)}
.pwd-score-big{font-size:4rem;font-weight:900;line-height:1;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.pwd-score-max{font-size:1.1rem;color:var(--muted);font-weight:800;margin-top:2px}
.pwd-level-badge{display:inline-block;margin-top:12px;padding:8px 22px;border-radius:999px;font-size:.9rem;font-weight:900;border:2px solid;letter-spacing:.5px}
.pwd-meter{margin:16px 0}
.pwd-meter-label{display:flex;justify-content:space-between;font-size:.75rem;font-weight:900;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.pwd-meter-bar{height:14px;background:#16223a;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.pwd-meter-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
.pwd-score-sequence{margin:16px 0;padding:14px;border:1px solid var(--line);border-radius:13px;background:rgba(3,6,13,.4)}
.pwd-score-step{display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid rgba(26,44,70,.6);font-size:.82rem;color:#cdd9ea}
.pwd-score-step:last-of-type{border-bottom:0}
.pwd-score-step .step-no{color:var(--cyan);font-weight:900}
.pwd-score-step .step-label{flex:1}
.pwd-score-step .step-value{font-weight:900;color:var(--cyan);white-space:nowrap}
.pwd-score-total{text-align:right;margin-top:10px;font-size:.8rem;color:var(--muted)}
.pwd-score-total b{color:var(--green)}
.pwd-findings{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pwd-findings-head{font-size:.72rem;font-weight:900;letter-spacing:1.5px;color:var(--muted);margin-top:12px;margin-bottom:2px}
.pwd-finding{padding:10px 14px;border-radius:10px;font-size:.84rem;line-height:1.55;display:flex;gap:10px;align-items:flex-start}
.pwd-finding.ok{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3);color:#c3d2e6}
.pwd-finding.ko{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);color:#c3d2e6}
.pwd-finding.tip{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:#c3d2e6}
.pwd-finding .fi{flex-shrink:0;font-size:1.05rem;line-height:1.3}
.pwd-finding .ft{flex:1}
.pwd-forgot{text-align:center;font-size:.74rem;color:var(--muted);margin-top:16px;padding:10px;background:rgba(52,211,153,.05);border:1px dashed rgba(52,211,153,.3);border-radius:10px;font-weight:800;letter-spacing:.3px;line-height:1.5}
.pwd-forgot b{color:var(--green)}
.pwd-result-secret{margin-bottom:16px}
.pwd-result-secret label{display:block;color:var(--muted);font-size:.75rem;font-weight:900;margin:0 0 7px 4px}

.sc-grid{display:grid;gap:14px}
.sc-card{position:relative;background:linear-gradient(160deg,rgba(20,28,46,.95),rgba(8,16,28,.95));border:2px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer;transition:all .28s;font-family:inherit;color:var(--txt);text-align:left;overflow:hidden}
.sc-card:hover{transform:translateY(-3px);border-color:var(--sc-color, rgba(244,114,182,.5));box-shadow:0 18px 40px -18px var(--sc-color, rgba(244,114,182,.5))}
.sc-card.marked{border-color:var(--red);background:linear-gradient(160deg,rgba(248,113,113,.14),rgba(248,113,113,.03));box-shadow:0 0 30px -10px rgba(248,113,113,.7)}
.sc-card.marked::after{content:'👥';position:absolute;top:12px;right:14px;font-size:1.5rem;animation:dangerPulse 1.1s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(248,113,113,.9));z-index:2}
.sc-card.locked{cursor:default;pointer-events:none}
.sc-card.whatsapp{--sc-color:#25d366}
.sc-card.email{--sc-color:var(--cyan)}
.sc-card.call{--sc-color:var(--amber)}
.sc-card.sms{--sc-color:#60a5fa}
.sc-card.instagram{--sc-color:var(--pink)}
.sc-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-right:32px;position:relative;z-index:1}
.sc-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;border:2px solid var(--sc-color, rgba(244,114,182,.4));background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));transition:.25s;position:relative}
.sc-avatar::after{content:'';position:absolute;bottom:-1px;right:-1px;width:13px;height:13px;border-radius:50%;background:var(--sc-color, var(--pink));border:2px solid var(--bg)}
.sc-card:hover .sc-avatar{transform:scale(1.08);box-shadow:0 0 25px -6px var(--sc-color, rgba(244,114,182,.9))}
.sc-info{flex:1;min-width:0}
.sc-sender{font-weight:900;font-size:.92rem;color:var(--txt);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-platform{display:inline-flex;align-items:center;gap:5px;font-size:.62rem;color:var(--sc-color, var(--muted));font-weight:900;letter-spacing:1.2px;text-transform:uppercase}
.sc-platform::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--sc-color, var(--muted))}
.sc-card.marked .sc-platform{color:#fca5a5}
.sc-card.marked .sc-platform::before{background:#fca5a5}
.sc-time{font-size:.68rem;color:var(--muted);font-weight:700;flex-shrink:0}
.sc-bubble{background:rgba(3,6,13,.62);padding:14px 16px;border-radius:14px 14px 14px 4px;font-size:.88rem;line-height:1.6;color:#cdd9ea;border-left:3px solid var(--sc-color, rgba(244,114,182,.5));position:relative;z-index:1}
.sc-card.marked .sc-bubble{color:#fca5a5;background:rgba(60,10,20,.4);border-left-color:rgba(248,113,113,.7)}

/* NETWORK GAME */
.net-game{display:flex;flex-direction:column;gap:16px}
.net-hero{position:relative;background:linear-gradient(135deg,rgba(30,45,70,.85),rgba(15,25,42,.85));border:1px solid rgba(34,211,238,.3);border-radius:18px;padding:22px 20px;display:flex;align-items:center;gap:18px;overflow:hidden}
.net-hero-icon{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(167,139,250,.2));border:2px solid rgba(34,211,238,.5);display:flex;align-items:center;justify-content:center;font-size:2.4rem;flex-shrink:0;box-shadow:0 0 30px -8px rgba(34,211,238,.6)}
.net-hero-text{flex:1;min-width:0}
.net-hero-level{font-size:.6rem;font-weight:900;letter-spacing:2px;color:var(--amber);margin-bottom:6px;text-transform:uppercase}
.net-hero-title{font-size:1.15rem;font-weight:900;color:var(--cyan);margin-bottom:8px;line-height:1.25}
.net-hero-desc{font-size:.85rem;color:#cdd9ea;line-height:1.6}
.net-hero-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.net-count-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:var(--amber);padding:4px 11px;border-radius:999px;font-size:.7rem;font-weight:900}
.net-trap-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.4);color:var(--red);padding:4px 11px;border-radius:999px;font-size:.7rem;font-weight:900}
.net-toggles{display:grid;gap:10px}
.net-toggle{position:relative;display:flex;align-items:flex-start;gap:14px;background:linear-gradient(135deg,rgba(3,6,13,.7),rgba(10,20,34,.7));border:2px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .25s;font-family:inherit;color:var(--txt);text-align:left;width:100%}
.net-toggle:hover{border-color:rgba(34,211,238,.4);transform:translateY(-1px)}
.net-toggle.on{border-color:rgba(52,211,153,.55);background:linear-gradient(135deg,rgba(52,211,153,.08),rgba(52,211,153,.02))}
.net-toggle.locked{cursor:default;pointer-events:none}
.net-toggle.correct-locked{border-color:rgba(52,211,153,.6);background:linear-gradient(135deg,rgba(52,211,153,.15),rgba(52,211,153,.03))}
.net-toggle.wrong-locked{border-color:rgba(248,113,113,.6);background:linear-gradient(135deg,rgba(248,113,113,.15),rgba(248,113,113,.03))}
.net-toggle-icon{width:42px;height:42px;border-radius:11px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.25);display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0}
.net-toggle.on .net-toggle-icon{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.4)}
.net-toggle-text{flex:1;min-width:0;padding-top:2px}
.net-toggle-label{font-size:.9rem;font-weight:800;color:var(--txt);margin-bottom:4px;line-height:1.3}
.net-toggle-sub{font-size:.75rem;color:var(--muted);line-height:1.5}
.net-toggle.on .net-toggle-label{color:var(--green)}
.net-toggle-status{flex-shrink:0;font-size:.6rem;font-weight:900;letter-spacing:.8px;padding:4px 9px;border-radius:8px;background:rgba(139,160,190,.15);color:#8ba0be;border:1px solid rgba(139,160,190,.3);margin-top:4px;white-space:nowrap}
.net-toggle.on .net-toggle-status{background:rgba(52,211,153,.2);color:var(--green);border-color:rgba(52,211,153,.5)}
.net-toggle-feedback{position:absolute;right:12px;top:14px;font-size:1.5rem;font-weight:900;display:none}
.net-toggle.correct-locked .net-toggle-feedback{display:block;color:var(--green)}
.net-toggle.wrong-locked .net-toggle-feedback{display:block;color:var(--red)}
.net-toggle.correct-locked .net-toggle-status,.net-toggle.wrong-locked .net-toggle-status{display:none}
.net-meter{margin-top:4px}
.net-meter-label{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;color:var(--muted);margin-bottom:6px}
.net-meter-label b{color:var(--cyan)}
.net-meter-bar{height:8px;background:#16223a;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.net-meter-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:99px;transition:width .4s ease}

.te-list{margin-top:14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.te-row{padding:11px 14px;border-radius:11px;font-size:.84rem;line-height:1.55}
.te-row.good{background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.25);color:#c3d2e6}
.te-row.bad{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);color:#c3d2e6}
.te-row.good .te-head{color:var(--green)}
.te-row.bad .te-head{color:var(--red)}
.te-head{font-weight:900;margin-bottom:5px;font-size:.86rem}
.te-body{font-size:.82rem;line-height:1.6;color:#cdd9ea}
.te-body b{color:var(--txt)}

.quiz-stage{display:flex;flex-direction:column;gap:18px}
.quiz-topbar{background:linear-gradient(180deg,rgba(30,45,70,.7),rgba(15,25,42,.7));border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.quiz-topbar-left{display:flex;align-items:center;gap:10px}
.quiz-cat-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(167,139,250,.2));border:1px solid rgba(34,211,238,.4);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.quiz-cat-name{font-size:.72rem;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--cyan)}
.quiz-progress-badge{font-size:.72rem;font-weight:900;padding:5px 12px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);border-radius:999px;color:var(--cyan);font-variant-numeric:tabular-nums}
.quiz-shuffled-badge{font-size:.65rem;font-weight:800;padding:4px 10px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);border-radius:999px;color:var(--amber);display:inline-flex;align-items:center;gap:5px}
.quiz-progressbar{height:8px;background:#16223a;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.quiz-progressfill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:99px;transition:width .45s cubic-bezier(.2,.9,.3,1.2)}
.quiz-card{position:relative;background:linear-gradient(160deg,rgba(16,26,44,.95),rgba(8,16,28,.95));border:2px solid var(--line);border-radius:20px;padding:32px 26px;text-align:center;overflow:hidden}
.quiz-card-icon{font-size:3rem;line-height:1;display:inline-block;margin-bottom:14px;filter:drop-shadow(0 4px 20px rgba(34,211,238,.5))}
.quiz-card-question{font-size:clamp(1.05rem,2.6vw,1.25rem);font-weight:800;line-height:1.5;color:var(--txt);max-width:600px;margin:0 auto}
.quiz-options{display:grid;gap:12px}
.quiz-option{position:relative;padding:18px 20px;border-radius:14px;font-weight:700;font-size:.92rem;cursor:pointer;border:2px solid var(--line);background:linear-gradient(135deg,rgba(10,20,34,.9),rgba(16,26,44,.9));color:var(--txt);font-family:inherit;transition:all .25s;text-align:left;line-height:1.45;display:flex;gap:14px;align-items:center}
.quiz-option .qo-letter{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(167,139,250,.15));color:var(--cyan);display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;font-size:1.1rem;border:1px solid rgba(34,211,238,.35);font-family:'Courier New',monospace}
.quiz-option:hover{border-color:rgba(34,211,238,.6);transform:translateY(-3px) scale(1.01);box-shadow:0 12px 28px -12px rgba(34,211,238,.5)}
.quiz-option .qo-text{flex:1;font-weight:700;line-height:1.45}
.quiz-option.correct{border-color:var(--green);background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(52,211,153,.05));color:var(--green)}
.quiz-option.correct .qo-letter{background:var(--green);color:#0a1220;border-color:var(--green)}
.quiz-option.correct .qo-text{color:var(--green);font-weight:800}
.quiz-option.correct::after{content:'✓';position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:1.4rem;font-weight:900;color:var(--green)}
.quiz-option.wrong{border-color:var(--red);background:linear-gradient(135deg,rgba(248,113,113,.18),rgba(248,113,113,.05));color:var(--red)}
.quiz-option.wrong .qo-letter{background:var(--red);color:#0a1220;border-color:var(--red)}
.quiz-option.wrong .qo-text{color:var(--red);font-weight:800}
.quiz-option.wrong::after{content:'✗';position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:1.4rem;font-weight:900;color:var(--red)}
.quiz-option:disabled{cursor:default;pointer-events:none}
.quiz-feedback{margin-top:16px;padding:16px 18px;border-radius:14px;font-size:.88rem;line-height:1.7}
.quiz-feedback.good{background:linear-gradient(135deg,rgba(52,211,153,.12),rgba(52,211,153,.03));border:1px solid rgba(52,211,153,.45);color:#c3d2e6}
.quiz-feedback.bad{background:linear-gradient(135deg,rgba(248,113,113,.12),rgba(248,113,113,.03));border:1px solid rgba(248,113,113,.45);color:#c3d2e6}
.quiz-feedback .qf-head{font-weight:900;font-size:.95rem;margin-bottom:6px}
.quiz-feedback.good .qf-head{color:var(--green)}
.quiz-feedback.bad .qf-head{color:var(--red)}
.quiz-feedback .qf-body{color:#cdd9ea;line-height:1.65}
.feedback{padding:14px 16px;border-radius:13px;font-size:.86rem;line-height:1.65;margin-top:14px}
.feedback.good{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.4);color:#c3d2e6}
.feedback.bad{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);color:#c3d2e6}
.feedback b{color:var(--txt)}
.end-hero{text-align:center;margin-bottom:16px}
.end-hero .big-emoji{font-size:3.5rem;display:inline-block}
.end-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 22px}
.end-stat{background:rgba(10,20,34,.75);border:1px solid var(--line);border-radius:12px;padding:12px 18px;text-align:center;min-width:100px}
.end-stat .n{font-size:1.4rem;font-weight:900;display:block}
.end-stat .t{font-size:.6rem;font-weight:800;letter-spacing:1px;color:var(--muted);margin-top:3px}
.end-stat .n.g{color:var(--green)}.end-stat .n.r{color:var(--red)}

.review-list{margin-top:14px;background:rgba(3,6,13,.5);border:1px solid var(--line);border-radius:13px;padding:14px;max-height:560px;overflow-y:auto;text-align:left}
.review-section-head{font-size:.72rem;font-weight:900;letter-spacing:1.5px;color:var(--muted);margin:18px 0 8px}
.review-item{padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:.82rem;line-height:1.55;color:#c3d2e6}
.review-item:last-child{border-bottom:none;padding-bottom:0}
.review-item:first-child{padding-top:0}
.review-item .ri-head{font-weight:900;margin-bottom:8px;font-size:.86rem;line-height:1.4}
.review-item.good .ri-head{color:var(--green)}
.review-item.bad .ri-head{color:var(--red)}
.ri-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ri-badge{font-size:.62rem;font-weight:900;padding:3px 10px;border-radius:999px;border:1px solid;letter-spacing:.3px}
.ri-badge.sel-on{background:rgba(34,211,238,.15);color:var(--cyan);border-color:rgba(34,211,238,.4)}
.ri-badge.sel-off{background:rgba(139,160,190,.12);color:#8ba0be;border-color:rgba(139,160,190,.35)}
.ri-badge.sel-none{background:rgba(251,191,36,.12);color:var(--amber);border-color:rgba(251,191,36,.35)}
.ri-badge.ri-ok{background:rgba(52,211,153,.15);color:var(--green);border-color:rgba(52,211,153,.45)}
.ri-badge.ri-ko{background:rgba(248,113,113,.15);color:var(--red);border-color:rgba(248,113,113,.45)}
.ri-badge.ri-correct{background:rgba(167,139,250,.12);color:var(--violet);border-color:rgba(167,139,250,.35)}
.ri-body{font-size:.8rem;line-height:1.6;color:#cdd9ea}

.final-hero{text-align:center;padding:20px 0;margin-bottom:16px;border-bottom:1px solid var(--line)}
.final-hero .trophy{font-size:4rem;display:inline-block}
.final-hero .final-score{font-size:3rem;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1;margin-top:8px}
.final-hero .final-lbl{font-size:.7rem;font-weight:900;letter-spacing:2px;color:var(--muted);margin-top:4px}
.final-rank{text-align:center;font-size:1rem;font-weight:900;padding:14px;border-radius:14px;margin:16px 0;border:1px solid}
.breakdown-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.bk-card{background:rgba(10,20,34,.75);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
.bk-card .bk-ico{font-size:1.5rem}
.bk-card .bk-name{font-size:.7rem;font-weight:800;color:var(--muted);margin-top:4px}
.bk-card .bk-score{font-size:1.1rem;font-weight:900;margin-top:6px}
.bk-card .bk-acc{font-size:.65rem;color:var(--muted);margin-top:2px}
.bk-card.strong{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08)}
.bk-card.mid{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.08)}
.bk-card.weak{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.08)}

<script>
(function(){
  var c=document.getElementById('matrix');
  if(!c)return;
  var ctx=c.getContext('2d');
  var W,H,cols,yPos,fontSize=14;
  var chars='01ABCDEF#$%&*/\\|<>{}[]=+-';
  function resize(){
    W=c.width=window.innerWidth;
    H=c.height=window.innerHeight;
    cols=Math.floor(W/fontSize);
    yPos=[];
    for(var i=0;i<cols;i++) yPos.push(Math.random()*H);
  }
  resize();
  window.addEventListener('resize',resize);
  function draw(){
    ctx.fillStyle='rgba(3,6,13,0.07)';
    ctx.fillRect(0,0,W,H);
    ctx.font=fontSize+'px monospace';
    for(var i=0;i<cols;i++){
      var ch=chars[Math.floor(Math.random()*chars.length)];
      var x=i*fontSize;
      var y=yPos[i];
      var r=Math.random();
      if(r>0.98){ctx.fillStyle='#c8faff';ctx.shadowColor='#22d3ee';ctx.shadowBlur=8;}
      else if(r>0.85){ctx.fillStyle='#22d3ee';ctx.shadowBlur=4;}
      else{ctx.fillStyle='#0e6b6b';ctx.shadowBlur=0;}
      ctx.fillText(ch,x,y);
      if(y>H&&Math.random()>0.975) yPos[i]=0;
      else yPos[i]+=fontSize;
    }
    ctx.shadowBlur=0;
  }
  var last=0;
  function loop(t){ if(t-last>55){draw();last=t;} requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();

function createTranslationPattern(translations){
  var keys = Object.keys(translations).filter(function(key){return key.length > 3;}).sort(function(a,b){return b.length-a.length;});
  return new RegExp(keys.map(function(key){
    return key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }).join('|'), 'g');
}
var TRANSLATIONS = { eu:BASQUE, en:ENGLISH };
var TRANSLATION_PATTERNS = {
  eu:createTranslationPattern(BASQUE),
  en:createTranslationPattern(ENGLISH)
};
var originalTextNodes = new WeakMap();
var originalAttributes = new WeakMap();

function translateText(text){
  var translations = TRANSLATIONS[currentLanguage];
  if(!translations || !text) return text;
  if(Object.prototype.hasOwnProperty.call(translations, text)) return translations[text];
  return text.replace(TRANSLATION_PATTERNS[currentLanguage], function(source){return translations[source];});
}

function translateSubtree(root){
  if(!root) return;
  if(root.nodeType === 3){
    if(!originalTextNodes.has(root)) originalTextNodes.set(root, root.nodeValue);
    var originalText = originalTextNodes.get(root);
    var text = translateText(originalText);
    if(root.nodeValue !== text) root.nodeValue = text;
    return;
  }
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  var node;
  while((node = walker.nextNode())){
    if(!originalTextNodes.has(node)) originalTextNodes.set(node, node.nodeValue);
    var source = originalTextNodes.get(node);
    var translated = translateText(source);
    if(node.nodeValue !== translated) node.nodeValue = translated;
  }
  var elements = root.querySelectorAll ? root.querySelectorAll('[aria-label],[title],[placeholder]') : [];
  for(var i=0;i<elements.length;i++){
    ['aria-label','title','placeholder'].forEach(function(attribute){
      if(elements[i].hasAttribute(attribute)){
        var saved = originalAttributes.get(elements[i]) || {};
        if(!Object.prototype.hasOwnProperty.call(saved, attribute)){
          saved[attribute] = elements[i].getAttribute(attribute);
          originalAttributes.set(elements[i], saved);
        }
        var value = saved[attribute];
        elements[i].setAttribute(attribute, translateText(value));
      }
    });
  }
  if(root.nodeType === 1 && root.matches && root.matches('[aria-label],[title],[placeholder]')){
    ['aria-label','title','placeholder'].forEach(function(attribute){
      if(root.hasAttribute(attribute)){
        var savedRoot = originalAttributes.get(root) || {};
        if(!Object.prototype.hasOwnProperty.call(savedRoot, attribute)){
          savedRoot[attribute] = root.getAttribute(attribute);
          originalAttributes.set(root, savedRoot);
        }
        var rootValue = savedRoot[attribute];
        root.setAttribute(attribute, translateText(rootValue));
      }
    });
  }
}

function setLanguage(language, shouldRender){
  currentLanguage = language === 'eu' || language === 'en' ? language : 'es';
  document.documentElement.lang = currentLanguage;
  document.title = currentLanguage === 'es'
    ? 'CiberJuegos · Aprende ciberseguridad jugando'
    : TRANSLATIONS[currentLanguage]['CiberJuegos · Aprende ciberseguridad jugando'];
  var selector = document.getElementById('language-select');
  if(selector) selector.value = currentLanguage;
  try {
    localStorage.setItem(LANGUAGE_KEY, currentLanguage);
  } catch(e) {
    if(typeof toast === 'function') toast('No se pudo guardar el idioma en este navegador.', 'bad');
  }
  if(shouldRender !== false && typeof render === 'function' && typeof state !== 'undefined') render();
  translateSubtree(document.body);
}

function initializeLanguage(){
  try {
    var savedLanguage = localStorage.getItem(LANGUAGE_KEY);
    currentLanguage = savedLanguage === 'eu' || savedLanguage === 'en' ? savedLanguage : 'es';
  } catch(e) {
    currentLanguage = 'es';
  }
  document.getElementById('language-select').value = currentLanguage;
  document.getElementById('language-select').addEventListener('change', function(event){
    setLanguage(event.target.value);
  });
  setLanguage(currentLanguage, false);
  if(window.MutationObserver){
    var languageObserver = new MutationObserver(function(records){
      records.forEach(function(record){
        if(record.type === 'childList'){
          record.addedNodes.forEach(function(added){
            if(added.nodeType === 1 || added.nodeType === 3) translateSubtree(added);
          });
        } else if(record.type === 'characterData' && record.target.nodeValue){
          if(!originalTextNodes.has(record.target)) originalTextNodes.set(record.target, record.target.nodeValue);
          var source = originalTextNodes.get(record.target);
          var translated = translateText(source);
          if(translated !== record.target.nodeValue) record.target.nodeValue = translated;
        }
      });
    });
    languageObserver.observe(document.body, { childList:true, characterData:true, subtree:true });
  }
}

function shuffleArray(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function shuffleQuestion(q){
  var indices = q.options.map(function(_,i){ return i; });
  var shuffled = shuffleArray(indices);
  var newOptions = shuffled.map(function(idx){ return q.options[idx]; });
  var newCorrect = shuffled.indexOf(q.correct);
  return { tag:q.tag, icon:q.icon, question:q.question, options:newOptions, correct:newCorrect, why:q.why };
}

var COMMON_PW = ['123456','password','12345678','qwerty','123456789','12345','1234','111111','1234567','dragon','123123','baseball','abc123','football','monkey','letmein','696969','shadow','master','666666','qwertyuiop','123321','mustang','1234567890','michael','654321','superman','1qaz2wsx','7777777','121212','000000','qazwsx','123qwe','killer','trustno1','jordan','jennifer','zxcvbnm','asdfgh','hunter','buster','soccer','harley','batman','andrew','tigger','sunshine','iloveyou','2000','charlie','robert','thomas','hockey','ranger','daniel','starwars','klaster','112233','george','computer','michelle','jessica','pepper','1111','zxcvbn','555555','11111111','131313','freedom','777777','pass','maggie','159753','aaaaaa','ginger','princess','joshua','cheese','amanda','summer','love','ashley','6969','nicole','chelsea','biteme','matthew','access','yankees','987654321','dallas','austin','thunder','taylor','matrix'];
var DICT_WORDS = ['password','admin','user','login','welcome','secret','love','iloveyou','qwerty','abc','test','demo','letmein','master','root','toor','default','guest','asdf','zxcv','michael','jennifer','jesus','angel','dragon','monkey','football','baseball','soccer','hockey','shadow','sunshine','princess','freedom','whatever','trustno','computer','internet','google','facebook','amazon','apple','microsoft','samsung','iphone','android'];

function analyzePassword(pw){
  var results = {
    score: 0,
    strengths: [],
    weaknesses: [],
    recommendations: [],
    scoreBreakdown: { length: 0, variety: 0, bonuses: 0, penalties: 0, base: 0 },
    level: null,
    length: pw ? pw.length : 0
  };

  if (!pw || pw.length === 0) {
    results.weaknesses.push('La contraseña está vacía.');
    results.level = classifyPasswordStrength(0);
    return results;
  }

  var len = pw.length;
  var lower = pw.toLowerCase();
  var hasLower = /[a-z]/.test(pw);
  var hasUpper = /[A-Z]/.test(pw);
  var hasDigit = /[0-9]/.test(pw);
  var hasSymbol = /[^a-zA-Z0-9]/.test(pw);
  var hasSpace = /\s/.test(pw);

  // --- LONGITUD (máx 60 pts) ---
  var lenScore = 0;
  if (len < 8) lenScore = 0;
  else if (len < 12) lenScore = 15;
  else if (len < 16) lenScore = 30;
  else if (len < 20) lenScore = 45;
  else lenScore = 60;

  if (len >= 16) results.strengths.push('Longitud excelente (' + len + ' caracteres): muy difícil de romper por fuerza bruta.');
  else if (len >= 12) results.strengths.push('Longitud buena (' + len + ' caracteres).');
  else if (len < 8) results.weaknesses.push('Longitud insuficiente (' + len + ' caracteres). Lo recomendable es 12–16 o más.');
  else results.weaknesses.push('Longitud corta (' + len + ' caracteres). Intenta llegar a 16+.');

  // --- VARIEDAD (máx 50 pts) ---
  var varietyScore = 0;
  var typesCount = 0;
  if (hasLower) { varietyScore += 10; typesCount++; }
  if (hasUpper) { varietyScore += 10; typesCount++; }
  if (hasDigit) { varietyScore += 10; typesCount++; }
  if (hasSymbol) { varietyScore += 15; typesCount++; }
  if (hasSpace) { varietyScore += 5; typesCount++; }
  varietyScore = Math.min(varietyScore, 50);

  if (typesCount >= 4) results.strengths.push('Combinas varios tipos de caracteres. Excelente variedad.');
  else if (typesCount === 3) results.strengths.push('Usas 3 tipos de caracteres. Bien, pero puedes añadir más variedad.');
  else if (typesCount <= 2) results.weaknesses.push('Solo usas ' + typesCount + ' tipo(s) de caracteres. Combina mayúsculas, minúsculas, números y símbolos.');

  if (!hasUpper) results.weaknesses.push('No contiene mayúsculas.');
  if (!hasDigit) results.weaknesses.push('No contiene números.');
  if (!hasSymbol) results.weaknesses.push('No contiene símbolos especiales (ej. !@#$%^&*).');

  // --- PATRONES COMUNES ---
  var penalties = 0;
  var bonuses = 0;
  var isCommon = COMMON_PW.indexOf(lower) !== -1;
  if (isCommon) {
    results.weaknesses.push('⚠️ Está en las listas de contraseñas más usadas del mundo. Se rompe en segundos.');
    penalties += 60;
    results.recommendations.push('Evita contraseñas conocidas y reutilizadas; crea una clave única con ayuda de un gestor.');
  }

  var dictHit = null;
  for (var i = 0; i < DICT_WORDS.length; i++) {
    if (lower.indexOf(DICT_WORDS[i]) !== -1) { dictHit = DICT_WORDS[i]; break; }
  }
  if (dictHit) {
    results.weaknesses.push('Contiene la palabra común "' + dictHit + '", fácil de adivinar.');
    penalties += 20;
    results.recommendations.push('Evita palabras comunes o nombres; usa varias palabras aleatorias y no relacionadas.');
  }

  var yearMatch = pw.match(/(19|20)\d{2}/);
  if (yearMatch) {
    results.weaknesses.push('Contiene un año (' + yearMatch[0] + '), típico en cumpleaños y fechas.');
    penalties += 10;
    results.recommendations.push('Quita años y fechas personales, que suelen ser fáciles de descubrir.');
  }

  var hasNumberSequence = /012|123|234|345|456|567|678|789/.test(pw);
  if (hasNumberSequence) {
    results.weaknesses.push('Contiene una secuencia numérica (123...). Los atacantes la prueban primero.');
    penalties += 15;
    results.recommendations.push('Evita secuencias consecutivas de números y sustituciones previsibles.');
  }
  var hasLetterSequence = /abc|bcd|cde|def|efg|fgh|ghi|hij|ijk|jkl|klm|lmn|mno|nop|opq|pqr|qrs|rst|stu|tuv|uvw|vwx|wxy|xyz/i.test(pw);
  if (hasLetterSequence) {
    results.weaknesses.push('Contiene una secuencia alfabética (abc...). Patrón muy predecible.');
    penalties += 15;
    results.recommendations.push('Evita secuencias alfabéticas como abc o xyz.');
  }
  var hasRepeatedCharacters = /(.)\1{2,}/.test(pw);
  if (hasRepeatedCharacters) {
    results.weaknesses.push('Contiene 3 o más caracteres repetidos. Reduce la entropía.');
    penalties += 10;
    results.recommendations.push('Evita repetir el mismo carácter varias veces seguidas.');
  }
  var hasKeyboardPattern = /qwerty|asdf|zxcv|qaz|wsx|edc/i.test(pw);
  if (hasKeyboardPattern) {
    results.weaknesses.push('Contiene un patrón de teclado (qwerty, asdf...). Muy predecible.');
    penalties += 20;
    results.recommendations.push('No uses recorridos del teclado como qwerty o asdf.');
  }

  // --- BONUS ---
  if (len >= 16 && typesCount >= 3 && !isCommon && !yearMatch) {
    bonuses += 20;
    results.strengths.push('Longitud y variedad cumplen los estándares modernos.');
  }
  if (len >= 20 && hasSpace) {
    bonuses += 25;
    results.strengths.push('Frase larga con espacios: gran entropía y fácil de recordar.');
  }

  var baseScore = Math.max(0, Math.min(155, lenScore + varietyScore + bonuses - penalties));
  results.scoreBreakdown = {
    length: lenScore,
    variety: varietyScore,
    bonuses: bonuses,
    penalties: penalties,
    base: baseScore
  };
  results.score = Math.round(baseScore * 200 / 155);

  // --- RECOMENDACIONES ---
  if (len < 16) results.recommendations.push('Amplía la longitud a 16+ caracteres.');
  if (!hasUpper) results.recommendations.push('Añade al menos una mayúscula.');
  if (!hasDigit) results.recommendations.push('Añade al menos un número.');
  if (!hasSymbol) results.recommendations.push('Añade al menos un símbolo (!@#$%^&*).');
  if (typesCount < 4) results.recommendations.push('Combina los 4 tipos de caracteres.');
  if (len < 20) results.recommendations.push('Considera una frase de 4–5 palabras con separadores.');
  if (len >= 20 && hasSpace && typesCount >= 4 && results.recommendations.length === 0) {
    results.recommendations.push('No reutilices esta contraseña y guárdala en un gestor de contraseñas.');
  }
  if (results.recommendations.length === 0) results.recommendations.push('¡Vas por buen camino! Mantén esta práctica.');

  results.level = classifyPasswordStrength(results.score);
  return results;
}

function classifyPasswordStrength(score) {
  if (score >= 170) return { level: 'excelente', color: '#34d399', bg: 'rgba(52,211,153,.15)', label: '💎 Excelente' };
  if (score >= 130) return { level: 'muy-fuerte', color: '#34d399', bg: 'rgba(52,211,153,.12)', label: '🟢 Muy fuerte' };
  if (score >= 90)  return { level: 'fuerte', color: '#22d3ee', bg: 'rgba(34,211,238,.12)', label: '🔵 Fuerte' };
  if (score >= 50)  return { level: 'medio', color: '#fbbf24', bg: 'rgba(251,191,36,.12)', label: '🟡 Medio' };
  if (score >= 20)  return { level: 'debil', color: '#f87171', bg: 'rgba(248,113,113,.12)', label: '🟠 Débil' };
  return { level: 'critico', color: '#f87171', bg: 'rgba(248,113,113,.15)', label: '🔴 Crítico' };
}

var STORAGE_KEY = 'ciberjuegos_v1';
var storageWarningShown = false;

function saveState(){
  try {
    var active = null;
    if((state.screen === 'intro' || state.screen === 'game') && GAMES[state.gameIndex]){
      var game = GAMES[state.gameIndex];
      active = {
        screen: state.screen,
        gameIndex: state.gameIndex,
        sessionOk: state.sessionOk,
        sessionKo: state.sessionKo,
        sessionScore: state.sessionScore,
        review: state.review,
        ended: state.ended
      };
      if(game.type === 'clicker'){
        active.items = state.items.map(function(item){ return { marked: !!item.marked }; });
      } else if(game.type === 'quiz'){
        active.quizIndex = state.quizIndex;
        active.quizSelected = state.quizSelected;
        active.quizShuffled = state.quizShuffled;
      } else if(game.type === 'config'){
        active.configIndex = state.configIndex;
        active.configToggles = state.configToggles;
        active.configChecked = state.configChecked;
        active.configTogglesInitialized = state.configTogglesInitialized;
        active.configTogglesForIndex = state.configTogglesForIndex;
        active.configShuffled = state.configShuffled;
      }
    }
    var toSave = {
      score: state.score,
      results: state.results,
      done: state.done,
      active: active
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (e) {
    if(!storageWarningShown){
      storageWarningShown = true;
      toast('No se pudo guardar el progreso en este navegador.', 'bad');
    }
  }
}

function loadState(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    var data = JSON.parse(raw);
    if (data && typeof data === 'object') {
      if (typeof data.score === 'number') state.score = data.score;
      if (data.results && typeof data.results === 'object') state.results = data.results;
      if (data.done && typeof data.done === 'object') state.done = data.done;
      try {
        restoreActiveState(data.active);
      } catch (e) {
        state.screen = 'lobby';
        state.gameIndex = 0;
        state.items = [];
        state.ended = false;
        state.sessionOk = 0;
        state.sessionKo = 0;
        state.sessionScore = 0;
        state.review = [];
        state.quizShuffled = null;
        state.configShuffled = null;
        state.configToggles = [];
        state.configTogglesInitialized = false;
        toast('No se pudo recuperar la partida guardada. Puedes empezar de nuevo.', 'bad');
      }
      return true;
    }
  } catch (e) { /* datos corruptos → ignorar */ }
  return false;
}

function restoreActiveState(active){
  if(!active || (active.screen !== 'intro' && active.screen !== 'game') ||
      !Number.isInteger(active.gameIndex) || !GAMES[active.gameIndex]) return;

  var game = GAMES[active.gameIndex];
  if(active.screen === 'game'){
    if(game.type === 'quiz' && (!Array.isArray(active.quizShuffled) ||
        active.quizShuffled.length !== game.data.length ||
        !Number.isInteger(active.quizIndex) || active.quizIndex < 0 || active.quizIndex >= game.data.length ||
        !Number.isInteger(active.quizSelected) || active.quizSelected < -1 || active.quizSelected > 2)){
      throw new Error('El progreso guardado del cuestionario no es válido.');
    }
    if(game.type === 'config' && (!Array.isArray(active.configShuffled) ||
        active.configShuffled.length !== game.data.length ||
        !Number.isInteger(active.configIndex) || active.configIndex < 0 || active.configIndex >= game.data.length)){
      throw new Error('El progreso guardado de configuración no es válido.');
    }
  }
  state.gameIndex = active.gameIndex;
  state.screen = active.screen;
  state.sessionOk = Number.isFinite(active.sessionOk) ? active.sessionOk : 0;
  state.sessionKo = Number.isFinite(active.sessionKo) ? active.sessionKo : 0;
  state.sessionScore = Number.isFinite(active.sessionScore) ? active.sessionScore : 0;
  state.review = Array.isArray(active.review) ? active.review : [];
  state.ended = active.ended === true;

  if(game.type === 'clicker'){
    state.items = game.data.map(function(item, index){
      var copy = {};
      for(var key in item) copy[key] = item[key];
      copy.marked = !!(active.items && active.items[index] && active.items[index].marked);
      return copy;
    });
  } else if(game.type === 'quiz' && Array.isArray(active.quizShuffled) &&
      active.quizShuffled.length === game.data.length){
    state.quizIndex = Number.isInteger(active.quizIndex) ? active.quizIndex : 0;
    state.quizSelected = Number.isInteger(active.quizSelected) ? active.quizSelected : -1;
    state.quizShuffled = active.quizShuffled.map(function(saved, index){
      var original = game.data[index];
      var remaining = original.options.slice();
      if(!saved || !Array.isArray(saved.options) || saved.options.length !== remaining.length){
        throw new Error('El progreso guardado del cuestionario no es válido.');
      }
      var options = saved.options.map(function(option){
        var optionIndex = remaining.indexOf(option);
        if(optionIndex === -1) throw new Error('El progreso guardado del cuestionario no es válido.');
        remaining.splice(optionIndex, 1);
        return option;
      });
      return {
        tag: original.tag,
        icon: original.icon,
        question: original.question,
        options: options,
        correct: options.indexOf(original.options[original.correct]),
        why: original.why
      };
    });
  } else if(game.type === 'config' && Array.isArray(active.configShuffled) &&
      active.configShuffled.length === game.data.length){
    state.configIndex = Number.isInteger(active.configIndex) ? active.configIndex : 0;
    state.configShuffled = active.configShuffled.map(function(saved, index){
      var original = game.data[index];
      var remaining = original.toggles.slice();
      if(!saved || !Array.isArray(saved.toggles) || saved.toggles.length !== remaining.length){
        throw new Error('El progreso guardado de configuración no es válido.');
      }
      var toggles = saved.toggles.map(function(savedToggle){
        var toggleIndex = -1;
        for(var i=0;i<remaining.length;i++){
          if(remaining[i].label === savedToggle.label){ toggleIndex = i; break; }
        }
        if(toggleIndex === -1) throw new Error('El progreso guardado de configuración no es válido.');
        return remaining.splice(toggleIndex, 1)[0];
      });
      return {
        icon: original.icon,
        level: original.level,
        title: original.title,
        desc: original.desc,
        traps: original.traps,
        toggles: toggles
      };
    });
    state.configToggles = Array.isArray(active.configToggles) ? active.configToggles : [];
    state.configChecked = active.configChecked === true;
    state.configTogglesInitialized = active.configTogglesInitialized === true;
    state.configTogglesForIndex = Number.isInteger(active.configTogglesForIndex) ? active.configTogglesForIndex : -1;
    if(state.configTogglesInitialized && state.configTogglesForIndex === state.configIndex &&
        state.configToggles.length !== state.configShuffled[state.configIndex].toggles.length){
      throw new Error('El progreso guardado de configuración no es válido.');
    }
  } else if(game.type === 'password'){
    state.passwordPhase = 'input';
    state.passwordResult = null;
    state.passwordDisplay = '';
    state.passwordBestResult = null;
    state.passwordBestScore = 0;
  }
}

}

  else { $id('hudTema').textContent = '—'; }
  var hudQ = $id('hudQ');
  if(state.screen==='game'){
    var g = GAMES[state.gameIndex];
    if(g.type==='clicker') hudQ.textContent = state.items.filter(function(x){return x.marked;}).length + ' marcados';
    else if(g.type==='quiz') hudQ.textContent = (state.quizIndex+1) + '/' + g.data.length;

function toast(msg,type){
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){t.classList.add('show');},20);
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },300); },1100);
}
function escHTML(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getExt(name){
  var parts = String(name).split('.');
  return parts.length > 1 ? '.' + parts[parts.length - 1] : '';
}

  var optsHTML = q.options.map(function(opt,i){

      '<div class="quiz-progressbar"><div class="quiz-progressfill" style="width:'+pct+'%"></div></div>' +
      '<div class="quiz-card">' +
        '<div class="quiz-card-icon">'+catIcon+'</div>' +
        '<div class="quiz-card-question">'+escHTML(q.question)+'</div>' +
      '</div>' +
      '<div class="quiz-options">'+optsHTML+'</div>' +
      bottom +
    '</div>' +
  '</div>';
}

function handleQuizAnswer(idx){
  if(state.quizSelected !== -1) return;
  var q = state.quizShuffled[state.quizIndex];
  state.quizSelected = idx;
  var ok = (idx === q.correct);
  if(ok){ state.sessionScore += 20; state.sessionOk++; toast('+20','good'); }
  else  { state.sessionScore -= 10; state.sessionKo++; toast('−10','bad'); }
  var userLetter    = String.fromCharCode(65 + idx);
  var correctLetter = String.fromCharCode(65 + q.correct);
  state.review.push({
    head: 'Pregunta ' + (state.quizIndex+1) + ': ' + q.question,
    ok: ok,
    userDid: 'Elegiste ' + userLetter,
    userBadge: 'selected',
    why: q.why,
    correctAction: ok ? null : 'La correcta era ' + correctLetter + ': ' + q.options[q.correct],
    qIndex: state.quizIndex
  });
  render();
}
function handleQuizNext(){
  var g = GAMES[state.gameIndex];
  state.quizIndex++;
  state.quizSelected = -1;
  if(state.quizIndex >= g.data.length){ return finishGame(); }
  render();
}

function renderConfig(){
  var g = GAMES[state.gameIndex];
  var total = g.data.length;
  if(state.configIndex >= total){ return finishGame(); }
  var s = state.configShuffled[state.configIndex];

  if(!state.configTogglesInitialized || state.configTogglesForIndex !== state.configIndex){
    state.configToggles = s.toggles.map(function(t){ return { on:false }; });
    state.configChecked = false;
    state.configTogglesInitialized = true;
    state.configTogglesForIndex = state.configIndex;
  }

  var togglesHTML = s.toggles.map(function(t,i){
    var userOn = state.configToggles[i].on;
    var cls = 'net-toggle';
    if(userOn) cls += ' on';
    if(state.configChecked) cls += ' locked';
    if(state.configChecked){
      var isCorrect = (userOn === t.correct);
      cls += isCorrect ? ' correct-locked' : ' wrong-locked';
    }
    var attr = state.configChecked ? '' : ' data-action="config-toggle" data-val="'+i+'"';
    var feedbackIcon = state.configChecked ? '<span class="net-toggle-feedback">' + (userOn === t.correct ? '✓' : '✗') + '</span>' : '';
    return '<button class="'+cls+'"'+attr+'>' +
      '<div class="net-toggle-icon">'+escHTML(t.icon || '🔧')+'</div>' +
      '<div class="net-toggle-text">' +
        '<div class="net-toggle-label">'+escHTML(t.label)+'</div>' +
        '<div class="net-toggle-sub">'+escHTML(t.sub)+'</div>' +
      '</div>' +
      '<div class="net-toggle-status">'+(userOn?'ACTIVADO':'DESACTIVADO')+'</div>' +
      feedbackIcon +
    '</button>';
  }).join('');

  var activeCount = state.configToggles.filter(function(t){return t.on;}).length;
  var totalToggles = s.toggles.length;
  var pct = (activeCount / totalToggles) * 100;

  var bottom = '';
  if(state.configChecked){
    var okCount = 0;
    var allRows = '';
    s.toggles.forEach(function(t,i){
      var userOn = state.configToggles[i].on;
      var isCorrect = (userOn === t.correct);
      var userDesc = userOn ? 'Activaste' : 'Dejaste desactivado';
      var correctDesc = t.correct ? 'debería estar ACTIVADO' : 'debería estar DESACTIVADO';
      var whyText = t.why || 'Esta opción es ' + (t.correct ? 'buena práctica' : 'mala práctica') + ' de seguridad.';
      if(isCorrect){
        okCount++;
        allRows += '<div class="te-row good">' +
          '<div class="te-head">✓ ' + escHTML(t.label) + '</div>' +
          '<div class="te-body"><b>' + userDesc + '</b> y era lo correcto. ' + escHTML(whyText) + '</div>' +
        '</div>';
      } else {
        allRows += '<div class="te-row bad">' +
          '<div class="te-head">✗ ' + escHTML(t.label) + '</div>' +
          '<div class="te-body"><b>' + userDesc + '</b>, pero <b>' + correctDesc + '</b>.<br>' + escHTML(whyText) + '</div>' +
        '</div>';
      }
    });
    var perfect = (okCount === totalToggles);
    var pts = perfect ? 50 : okCount * 10;

    var feedbackHTML = '<div class="feedback ' + (perfect?'good':'bad') + '">' +
      '<b>' + (perfect ? '🎯 ¡Escenario perfecto! +50 pts' : 'Ajustes correctos: ' + okCount + '/' + totalToggles + ' · +' + pts + ' pts') + '</b>' +
    '</div>';

    feedbackHTML += '<div class="te-list">' +
      '<div style="font-size:.72rem;font-weight:900;letter-spacing:1.5px;color:var(--muted);margin:8px 0 4px">📚 EXPLICACIÓN DE TUS RESPUESTAS</div>' +
      allRows +
    '</div>';

    bottom = feedbackHTML +
      '<button class="btn btn-primary" style="margin-top:14px" data-action="config-next">' +
      (state.configIndex < total-1 ? 'Siguiente escenario →' : 'Terminar juego')+'</button>' +
      '<button class="btn btn-finish" data-action="finish">🏁 Finalizar y ver resultado</button>';
  } else {
    bottom = '<button class="btn btn-primary" data-action="config-check">Comprobar configuración</button>' +
             '<button class="btn btn-finish" data-action="finish">🏁 Finalizar y ver resultado</button>';
  }

  var trapBadge = s.traps ? '<div class="net-trap-badge">⚠️ '+s.traps+' trampa'+(s.traps>1?'s':'')+'</div>' : '';

  stage.innerHTML = '<div class="panel" style="--tc:'+g.color+'">' +
    '<div class="game-header"><div class="game-title">'+g.icon+' '+g.name+'</div>' +
    '<div class="game-info"><div class="badge">Escenario <b>'+(state.configIndex+1)+'/'+total+'</b></div>' +
    '<div class="badge">Aciertos <b style="color:var(--green)">'+state.sessionOk+'</b></div>' +
    '<div class="badge">Fallos <b style="color:var(--red)">'+state.sessionKo+'</b></div></div></div>' +
    '<div class="net-game">' +
      '<div class="net-hero">' +
        '<div class="net-hero-icon">'+(s.icon || '📶')+'</div>' +
        '<div class="net-hero-text">' +
          '<div class="net-hero-level">'+escHTML(s.level || '')+'</div>' +
          '<div class="net-hero-title">'+escHTML(s.title)+'</div>' +
          '<div class="net-hero-desc">'+escHTML(s.desc)+'</div>' +
          '<div class="net-hero-badges">' +
            '<div class="net-count-badge">🛡️ '+activeCount+' de '+totalToggles+' activadas</div>' +
            trapBadge +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="net-toggles">'+togglesHTML+'</div>' +
      '<div class="net-meter">' +
        '<div class="net-meter-label"><span>Ajustes activados</span><b>'+activeCount+'/'+totalToggles+'</b></div>' +
        '<div class="net-meter-bar"><div class="net-meter-fill" style="width:'+pct+'%"></div></div>' +
      '</div>' +
    '</div>' + bottom + '</div>';
}

function handleConfigToggle(idx){
  if(state.configChecked) return;
  var t = state.configToggles[idx];
  if(!t) return;
  t.on = !t.on;
  render();
}
function handleConfigCheck(){
  if(state.configChecked) return;
  state.configChecked = true;
  var s = state.configShuffled[state.configIndex];
  var okCount = 0;
  for(var i=0;i<state.configToggles.length;i++){
    if(state.configToggles[i].on === s.toggles[i].correct) okCount++;
  }
  var perfect = (okCount === s.toggles.length);
  var pts = perfect ? 50 : okCount * 10;
  state.sessionScore += pts;
  state.sessionOk += okCount;
  state.sessionKo += (s.toggles.length - okCount);
  toast((pts>=0?'+':'')+pts, perfect?'good':'bad');

  for(var j=0;j<s.toggles.length;j++){
    var t = s.toggles[j];
    var userOn = state.configToggles[j].on;
    var isCorrect = (userOn === t.correct);
    state.review.push({
      head: 'Esc. ' + (state.configIndex+1) + ' · ' + t.label,
      ok: isCorrect,
      userDid: userOn ? 'Activaste' : 'Dejaste desactivado',
      userBadge: userOn ? 'selected' : 'unselected',
      why: t.why,
      correctAction: isCorrect ? null : (t.correct ? 'Debería estar ACTIVADO' : 'Debería estar DESACTIVADO')
    });
  }
  render();
}
function handleConfigNext(){
  var g = GAMES[state.gameIndex];
  state.configIndex++;
  state.configToggles = [];
  state.configChecked = false;
  state.configTogglesInitialized = false;
  state.configTogglesForIndex = -1;
  if(state.configIndex >= g.data.length){ return finishGame(); }
  render();
}

  var inner = '';

  if(phase === 'input'){
    var hasBest = state.passwordBestScore > 0;
    var bestLabel = hasBest
      ? '<div style="text-align:center;font-size:.82rem;color:var(--green);font-weight:900">🏆 Tu mejor resultado hasta ahora: ' + state.passwordBestScore + ' / 200</div>'
      : '';

    inner =
      '<div class="pwd-forgot">🔒 El análisis se realiza localmente en este dispositivo. La contraseña no se envía a ningún servidor ni se guarda en tu progreso. Usa solo una contraseña ficticia.</div>' +
      bestLabel +

        '<input type="password" id="pwd-input-field" class="pwd-input" aria-label="Contraseña ficticia para análisis local" placeholder="Escribe una contraseña ficticia..." autocomplete="off" spellcheck="false" maxlength="128">' +
        '<button class="pwd-toggle-vis" data-action="pwd-toggle-vis" title="Mostrar/ocultar contraseña" aria-label="Mostrar u ocultar contraseña">👁️</button>' +

      '<div class="pwd-score-step"><span class="step-no">4.</span><span class="step-label">Bonificaciones por longitud y frase</span><span class="step-value">+' + breakdown.bonuses + ' pts</span></div>';

    inner =
      '<div class="pwd-result-secret">' +
        '<label for="pwd-result-field">Contraseña analizada (oculta)</label>' +
        '<div class="pwd-input-wrap">' +
          '<input type="password" readonly id="pwd-result-field" class="pwd-input" autocomplete="off" aria-label="Contraseña analizada, oculta">' +
          '<button class="pwd-toggle-vis" data-action="pwd-toggle-result-vis" title="Mostrar/ocultar contraseña" aria-label="Mostrar u ocultar contraseña">👁️</button>' +
        '</div>' +
      '</div>' +
