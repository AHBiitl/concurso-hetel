function handlePasswordAnalyze(){
  var inp = document.getElementById('pwd-input-field');
  var val = inp ? inp.value : '';
  if(!val || val.length === 0){
    toast('Escribe una contraseña primero', 'bad');
    return;
  }
  var result = analyzePassword(val);
  state.passwordResult = result;
  state.passwordDisplay = val;
  state.passwordPhase = 'result';
  if(result.score > state.passwordBestScore){
    state.passwordBestScore = result.score;
    state.passwordBestResult = result;
  }
  render();
}

function handlePasswordToggleVis(){
  var inp = document.getElementById('pwd-input-field');
  if(!inp) return;
  inp.type = (inp.type === 'password') ? 'text' : 'password';
}

function handlePasswordToggleResultVis(){
  var inp = document.getElementById('pwd-result-field');
  if(!inp) return;
  inp.type = (inp.type === 'password') ? 'text' : 'password';
}

function handlePasswordRetry(){
  state.passwordPhase = 'input';
  state.passwordResult = null;
  state.passwordDisplay = '';
  render();
}

/* ============================================================
   FINALIZAR Y RENDER DE RESULTADO
   ============================================================ */

function finishGame(){
  if(state.ended) return;
  state.ended = true;
  var g = GAMES[state.gameIndex];

  if(g.type==='clicker'){
    var ok=0, ko=0, pts=0;
    var review = [];
    state.items.forEach(function(it){
      var rightDecision = (it.isBad === it.marked);
      var title = '';
      if(g.itemKind==='email') title = it.senderName + ' — ' + it.subject;
      else if(g.itemKind==='file') title = it.name;
      else if(g.itemKind==='message') title = (it.platformName || 'Mensaje') + ': ' + (it.message.substring(0,50)) + (it.message.length>50?'...':'');
      if(rightDecision){ ok++; pts += g.max / state.items.length; }
      else { ko++; pts -= 10; }
      review.push({
        head: title,
        ok: rightDecision,
        userDid: it.marked ? 'Marcaste' : 'No marcaste',
        userBadge: it.marked ? 'selected' : 'unselected',
        why: it.why,
        correctAction: rightDecision ? null : (it.isBad ? 'Deberías haberlo marcado' : 'No debías marcarlo')
      });
    });
    state.sessionOk = ok; state.sessionKo = ko; state.sessionScore = Math.round(pts); state.review = review;
  }

  if(g.type==='quiz'){
    var fullReview = [];
    for(var qi=0; qi<state.quizShuffled.length; qi++){
      var q = state.quizShuffled[qi];
      var existing = state.review.filter(function(r){ return r.qIndex === qi; })[0];
      if(existing){
        fullReview.push(existing);
      } else {
        var correctLetter = String.fromCharCode(65 + q.correct);
        fullReview.push({
          head: 'Pregunta ' + (qi+1) + ': ' + q.question,
          ok: false,
          userDid: 'No respondiste',
          userBadge: 'unanswered',
          why: q.why,
          correctAction: 'La correcta era ' + correctLetter + ': ' + q.options[q.correct],
          qIndex: qi
        });
      }
    }
    state.review = fullReview;
  }

  if(g.type==='password'){
    var best = state.passwordBestResult;
    if(best){
      state.sessionScore = best.score;
      state.sessionOk = best.strengths.length;
      state.sessionKo = best.weaknesses.length;
      var lvl = classifyPasswordStrength(best.score);
      state.review = [{
        head: 'Contraseña analizada · Nivel ' + lvl.label,
        ok: best.score >= 130,
        userDid: 'Puntuación: ' + best.score + ' / 200',
        userBadge: 'selected',
        why: 'La puntuación es orientativa y se basa en longitud, variedad y patrones previsibles.<br>Fortalezas detectadas: ' + best.strengths.length + ' · Debilidades detectadas: ' + best.weaknesses.length + '.',
        correctAction: best.score < 130 ? 'Para superar el reto, busca 130+ pts' : null
      }];
    } else {
      state.sessionScore = 0;
      state.sessionOk = 0;
      state.sessionKo = 1;
      state.review = [{
        head: 'No analizaste ninguna contraseña',
        ok: false,
        userDid: 'Sin datos',
        userBadge: 'unanswered',
        why: 'Para puntuar en este minijuego, escribe una contraseña ficticia y pulsa "Analizar contraseña".',
        correctAction: null
      }];
    }
    state.passwordResult = null;
    state.passwordDisplay = '';
    state.passwordBestResult = null;
    state.passwordBestScore = 0;
    state.passwordPhase = 'input';
  }

  state.results[g.id] = { ok: state.sessionOk, ko: state.sessionKo, pts: state.sessionScore, max: g.max };
  state.score = GAMES.reduce(function(sum, gm){
    var r = state.results[gm.id];
    return sum + (r ? r.pts : 0);
  }, 0);
  state.done[g.id] = true;
  saveState();
  state.screen = 'end';
  render();
}

function renderReviewItem(r){
  var okCls = r.ok ? 'good' : 'bad';
  var userBadgeCls = r.userBadge === 'selected' ? 'sel-on' :
                     r.userBadge === 'unanswered' ? 'sel-none' : 'sel-off';
  return '<div class="review-item ' + okCls + '">' +
    '<div class="ri-head">' + (r.ok ? '✅ ' : '❌ ') + escHTML(r.head) + '</div>' +
    '<div class="ri-badges">' +
      '<span class="ri-badge ' + userBadgeCls + '">👤 ' + escHTML(r.userDid) + '</span>' +
      '<span class="ri-badge ' + (r.ok ? 'ri-ok' : 'ri-ko') + '">' + (r.ok ? '✓ Correcto' : '✗ Incorrecto') + '</span>' +
      (r.correctAction ? '<span class="ri-badge ri-correct">' + escHTML(r.correctAction) + '</span>' : '') +
    '</div>' +
    '<div class="ri-body">' + r.why + '</div>' +
  '</div>';
}

function renderEnd(){
  var g = GAMES[state.gameIndex];
  var total = state.sessionOk + state.sessionKo;
  var acc = total ? Math.round((state.sessionOk/total)*100) : 0;
  var stars = acc>=80 ? 3 : acc>=50 ? 2 : 1;
  var starsHTML = '';
  for(var i=0;i<3;i++) starsHTML += i<stars ? '★' : '<span style="opacity:.2">★</span>';
  var allDone = Object.keys(state.done).length >= GAMES.length;
  var rank = '🌱 Sigue practicando';
  if(acc>=80) rank = '🥇 ¡Excelente! Dominas el tema';
  else if(acc>=50) rank = '🥈 Buen trabajo, repasa lo fallado';

  var okReview = state.review.filter(function(r){return r.ok;}).length;
  var koReview = state.review.length - okReview;

  var reviewHTML = '';
  if(state.review.length){
    reviewHTML = '<div style="margin-top:18px">' +
      '<div class="review-section-head">📋 REVISIÓN COMPLETA · ' + okReview + ' correctas · ' + koReview + ' incorrectas</div>' +
      '<div class="review-list">' + state.review.map(renderReviewItem).join('') + '</div></div>';
  } else {
    reviewHTML = '<div class="feedback good" style="margin-top:16px"><b>🎯 No hay elementos que revisar.</b></div>';
  }

  var finalBtn = allDone ? '<button class="btn btn-final" data-action="go-final">🏆 Ver mi resultado final</button>' : '';

  stage.innerHTML = '<div class="panel" style="--tc:'+g.color+'">' +
    '<div class="end-hero"><div class="big-emoji">'+(acc>=80?'🏆':acc>=50?'👍':'💪')+'</div>' +
    '<div style="font-size:1.4rem;letter-spacing:6px;margin-top:6px;color:var(--amber)">'+starsHTML+'</div></div>' +
    '<h2 class="title" style="color:'+g.color+';font-size:1.4rem">¡'+g.name+' completado!</h2>' +
    '<p class="subtitle">'+rank+'</p>' +
    '<div class="end-stats">' +
      '<div class="end-stat"><span class="n g">'+state.sessionOk+'</span><span class="t">ACIERTOS</span></div>' +
      '<div class="end-stat"><span class="n r">'+state.sessionKo+'</span><span class="t">FALLOS</span></div>' +
      '<div class="end-stat"><span class="n" style="color:var(--cyan)">'+acc+'%</span><span class="t">PRECISIÓN</span></div>' +
      '<div class="end-stat"><span class="n" style="color:'+(state.sessionScore>=0?'var(--green)':'var(--red)')+'">'+(state.sessionScore>=0?'+':'')+state.sessionScore+'</span><span class="t">PTS DEL JUEGO</span></div>' +
    '</div>' + reviewHTML + finalBtn +
    '<button class="btn btn-primary" style="margin-top:16px" data-action="go-select">🎮 Elegir otro minijuego</button>' +
    '<button class="btn btn-secondary" data-action="replay">🔄 Repetir este juego</button></div>';
}

function generateAIAnalysis(){
  var data = GAMES.map(function(g){
    var r = state.results[g.id];
    if(!r) return null;
    var t = r.ok + r.ko;
    var acc = t ? Math.round((r.ok/t)*100) : 0;
    return { id:g.id, name:g.name, acc:acc };
  }).filter(function(x){return x;});
  var strengths = data.filter(function(x){return x.acc >= 80;});
  var mid = data.filter(function(x){return x.acc >= 50 && x.acc < 80;});
  var weaknesses = data.filter(function(x){return x.acc < 50;});
  var text = '';
  if(strengths.length > 0 && weaknesses.length > 0){
    text = 'Tienes un perfil de aprendiz con buen criterio en algunos temas. ';
    text += 'Destacas especialmente en <b>' + strengths.map(function(s){return s.name;}).join(', ') + '</b>. ';
    text += 'En cambio, los temas de <b>' + weaknesses.map(function(s){return s.name;}).join(', ') + '</b> son tus puntos débiles.';
  } else if(strengths.length > 0 && weaknesses.length === 0){
    text = '¡Excelente trabajo! Destacas con claridad en <b>' + strengths.map(function(s){return s.name;}).join(', ') + '</b>. ';
    if(mid.length > 0) text += 'Aun así, no descuides <b>' + mid.map(function(s){return s.name;}).join(', ') + '</b>.';
    else text += 'Mantienes un nivel alto en todos los temas.';
  } else if(strengths.length === 0 && weaknesses.length > 0){
    text = 'Todavía te queda camino por recorrer, pero eso es bueno: tienes mucho margen de mejora. ';
    text += 'Los temas que más te cuestan son <b>' + weaknesses.map(function(s){return s.name;}).join(', ') + '</b>.';
  } else {
    text = 'Mantienes un nivel <b>medio y constante</b> en todos los temas. Repite los juegos fijándote en las explicaciones.';
  }
  return { strengths:strengths, mid:mid, weaknesses:weaknesses, text:text };
}

function renderFinal(){
  var totalOk = 0, totalKo = 0;
  GAMES.forEach(function(g){ var r = state.results[g.id]; if(r){ totalOk += r.ok; totalKo += r.ko; } });
  var total = totalOk + totalKo;
  var acc = total ? Math.round((totalOk/total)*100) : 0;
  var scoreRatio = state.score / TOTAL_MAX;
  var rank, rankColor;
  if(scoreRatio >= 0.85){ rank = '🥇 Experto en ciberseguridad'; rankColor = 'var(--green)'; }
  else if(scoreRatio >= 0.65){ rank = '🥈 Usuario concienciado'; rankColor = 'var(--cyan)'; }
  else if(scoreRatio >= 0.45){ rank = '🥉 Aprendiz avanzado'; rankColor = 'var(--amber)'; }
  else if(scoreRatio >= 0.25){ rank = '📘 Aprendiz en progreso'; rankColor = 'var(--violet)'; }
  else { rank = '🌱 Necesitas repasar lo básico'; rankColor = 'var(--red)'; }
  var analysis = generateAIAnalysis();
  var breakdownHTML = GAMES.map(function(g){
    var r = state.results[g.id];
    if(!r) return '';
    var t = r.ok + r.ko;
    var a = t ? Math.round((r.ok/t)*100) : 0;
    var cls = a>=80 ? 'strong' : a>=50 ? 'mid' : 'weak';
    return '<div class="bk-card '+cls+'"><div class="bk-ico">'+g.icon+'</div><div class="bk-name">'+g.name+'</div>' +
      '<div class="bk-score" style="color:'+(a>=80?'var(--green)':a>=50?'var(--amber)':'var(--red)')+'">'+a+'%</div>' +
      '<div class="bk-acc">'+r.ok+' ✓ · '+r.ko+' ✗</div></div>';
  }).join('');
  var tipsHTML = GAMES.map(function(g){
    var list = TIPS[g.id] || [];
    if(!list.length) return '';
    return '<div class="tip-block"><div class="tip-title" style="color:'+g.color+'">'+g.icon+' '+g.name+'</div>' +
      '<ul class="tip-list">' + list.map(function(t){return '<li>'+t+'</li>';}).join('') + '</ul></div>';
  }).join('');
  stage.innerHTML = '<div class="panel">' +
    '<div class="final-hero"><div class="trophy">'+(acc>=80?'🏆':acc>=50?'🎯':'📚')+'</div>' +
    '<div class="final-score">'+state.score+'<span style="font-size:1.2rem;color:var(--muted)"> / '+TOTAL_MAX+'</span></div>' +
    '<div class="final-lbl">PUNTUACIÓN FINAL</div></div>' +
    '<div class="final-rank" style="border-color:'+rankColor+';color:'+rankColor+';background:rgba(255,255,255,.03)">'+rank+'</div>' +
    '<div class="end-stats">' +
      '<div class="end-stat"><span class="n g">'+totalOk+'</span><span class="t">ACIERTOS</span></div>' +
      '<div class="end-stat"><span class="n r">'+totalKo+'</span><span class="t">FALLOS</span></div>' +
      '<div class="end-stat"><span class="n" style="color:var(--cyan)">'+acc+'%</span><span class="t">PRECISIÓN</span></div>' +
      '<div class="end-stat"><span class="n" style="color:var(--amber)">'+Object.keys(state.done).length+'/'+GAMES.length+'</span><span class="t">JUEGOS</span></div>' +
    '</div>' +
    '<h3 style="font-size:.72rem;font-weight:900;letter-spacing:1.8px;color:var(--muted);text-align:center;margin:22px 0 12px">📊 DESGLOSE POR TEMA</h3>' +
    '<div class="breakdown-grid">'+breakdownHTML+'</div>' +
    '<div class="ai-box"><div class="ai-head"><div class="ai-ico">🤖</div> ANÁLISIS PERSONALIZADO</div><div class="ai-text">'+analysis.text+'</div></div>' +
    '<div class="tips-section"><div class="tips-head">💡 CONSEJOS PARA TU DÍA A DÍA</div>' + tipsHTML + '</div>' +
    '<button class="btn btn-primary" style="margin-top:14px" data-action="go-lobby">🏠 Volver al inicio</button>' +
    '<button class="btn btn-secondary" data-action="go-select">🎮 Repetir minijuegos</button></div>';
}

function startGame(idx){
  state.gameIndex = idx;
  state.sessionOk = 0; state.sessionKo = 0; state.sessionScore = 0;
  state.review = []; state.ended = false;
  state.quizIndex = 0; state.quizSelected = -1;
  state.configIndex = 0; state.configToggles = []; state.configChecked = false;
  state.configTogglesInitialized = false; state.configTogglesForIndex = -1;
  state.quizShuffled = null; state.configShuffled = null;

  var g = GAMES[idx];
  if(g.type==='clicker'){
    state.items = g.data.map(function(it){ var c = {}; for(var k in it) c[k] = it[k]; c.marked = false; return c; });
  }
  if(g.type==='password'){
    state.passwordResult = null;
    state.passwordDisplay = '';
    state.passwordBestResult = null;
    state.passwordBestScore = 0;
    state.passwordPhase = 'input';
  }
  state.screen = 'intro';
  render();
}

function startCurrentGame(){
  var g = GAMES[state.gameIndex];

  if(state.results[g.id]){
    state.score -= state.results[g.id].pts;
    delete state.results[g.id];
  }

  state.sessionOk = 0; state.sessionKo = 0; state.sessionScore = 0;
  state.review = []; state.ended = false;
  state.quizIndex = 0; state.quizSelected = -1;
  state.configIndex = 0; state.configToggles = []; state.configChecked = false;
  state.configTogglesInitialized = false; state.configTogglesForIndex = -1;

  if(g.type==='clicker'){
    state.items = g.data.map(function(it){ var c = {}; for(var k in it) c[k] = it[k]; c.marked = false; return c; });
  } else if(g.type==='quiz'){
    state.quizShuffled = g.data.map(function(q){ return shuffleQuestion(q); });
  } else if(g.type==='config'){
    state.configShuffled = g.data.map(function(s){
      var shuffledToggles = shuffleArray(s.toggles);
      return { icon:s.icon, level:s.level, title:s.title, desc:s.desc, traps:s.traps, toggles:shuffledToggles };
    });
  } else if(g.type==='password'){
    state.passwordResult = null;
    state.passwordDisplay = '';
    state.passwordBestResult = null;
    state.passwordBestScore = 0;
    state.passwordPhase = 'input';
  }
  state.screen = 'game';
  render();
}

function handleAction(action, val){
  switch(action){
    case 'retry-boot': window.location.reload(); break;
    case 'retry-connection':
      if(navigator.onLine){
        window.location.reload();
      } else {
        var offlineMessage = $id('offline-message');
        if(offlineMessage) offlineMessage.textContent = 'Sin conexión todavía. Puedes seguir jugando; tu progreso se guarda en este dispositivo.';
      }
      break;
    case 'go-lobby': state.screen = 'lobby'; render(); break;
    case 'go-select': state.screen = 'select'; render(); break;
    case 'go-final': state.screen = 'final'; render(); break;
    case 'pick-game': startGame(parseInt(val,10)); break;
    case 'start-game': startCurrentGame(); break;
    case 'replay': startGame(state.gameIndex); break;
    case 'click-item': handleClickItem(parseInt(val,10)); break;
    case 'quiz-answer': handleQuizAnswer(parseInt(val,10)); break;
    case 'quiz-next': handleQuizNext(); break;
    case 'config-toggle': handleConfigToggle(parseInt(val,10)); break;
    case 'config-check': handleConfigCheck(); break;
    case 'config-next': handleConfigNext(); break;
    case 'pwd-toggle-vis': handlePasswordToggleVis(); break;
    case 'pwd-toggle-result-vis': handlePasswordToggleResultVis(); break;
    case 'pwd-analyze': handlePasswordAnalyze(); break;
    case 'pwd-retry': handlePasswordRetry(); break;
    case 'finish-quiz-confirm':
      var pending = parseInt(val || '0', 10);
      if(confirm(translateText('Quedan ' + pending + ' pregunta(s) sin responder. ¿Seguro que quieres finalizar? Las preguntas no respondidas contarán como fallo.'))){
        finishGame();
      }
      break;
    case 'reset-all':
      if(confirm(translateText('¿Seguro que quieres borrar todo tu progreso guardado? Esta acción no se puede deshacer.'))){
        clearPersistedState();
        state.score = 0;
        state.results = {};
        state.done = {};
        state.screen = 'lobby';
        render();
        toast('Progreso reiniciado', 'good');
      }
      break;
    case 'finish':
      finishGame();
      break;
  }
}

document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if(!btn) return;
  handleAction(btn.dataset.action, btn.dataset.val);
});

document.addEventListener('input', function(e){
  if(e.target && e.target.id === 'pwd-input-field'){
    var c = document.getElementById('pwd-char-counter');
    if(c) c.textContent = e.target.value.length + ' caracteres';
  }
});

window.addEventListener('offline', updateConnectionStatus);
window.addEventListener('online', function(){
  updateConnectionStatus();
  toast('Conexión restablecida', 'good');
});

try {
  initializeLanguage();
  initializeApp();
} catch (e) {
  stage.innerHTML = '<div class="boot-error" role="alert"><h1 class="title">No se pudo cargar el juego</h1>' +
    '<p class="subtitle">Comprueba la conexión e inténtalo de nuevo.</p>' +
    '<button class="btn btn-primary" data-action="retry-boot">Reintentar</button></div>';
}
</script>
</body>
</html>
